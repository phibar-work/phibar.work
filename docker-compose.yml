services:
  payload:
    image: node:18-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "pnpm install && pnpm dev"
    depends_on:
      - mongo
      - seaweedfs
    env_file:
      - .env

  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    command:
      - --storageEngine=wiredTiger
    volumes:
      - data:/data/db
    logging:
      driver: none

  # S3-compatible object storage (replaces MinIO, whose images are no longer published)
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    ports:
      - '9000:8333'
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024
      -s3 -s3.config=/etc/seaweedfs/s3.json
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://seaweedfs:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the default bucket on startup
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 's3.bucket.create -name media' | weed shell -master=seaweedfs:9333 || true;
      exit 0;
      "

volumes:
  data:
  node_modules:
  seaweedfs_data:
